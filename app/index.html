<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'">
<title>Magic Paint</title>
<meta name="description" content="Magic Paint — a joyful paint studio for little artists. Magic brushes, stickers, coloring pages and a friendly paint-drop buddy named Drip.">
<meta name="theme-color" content="#2A2358">
<link rel="icon" type="image/svg+xml" href="icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="fonts/fonts.css">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<style>
/* Layout: a toy-box paint studio. Pencil-case tray of brushes on the left, the paper in the middle,
   glossy paint blobs on the right, and a talking paint-drop buddy in the header.
   Phones held upright stack paper, then paints, then brushes. One bright look on purpose (no dark mode). */
:root{
  --ink:#2A2358;
  --room:#CBDCFF;
  --room-dot:#B6CBF7;
  --paper:#FFFFFF;
  --cloud:#F1EDFF;
  --sun:#FFD23F;
  --coral:#FF5D73;
  --mint:#1FC8A6;
  --grape:#8B5CF6;
  --sky:#38B6FF;
  --font-display:'Fredoka','Nunito','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-body:'Nunito','Avenir Next',system-ui,sans-serif;
  --edge:3px solid var(--ink);
  --lift:0 4px 0 var(--ink);
  --spring:cubic-bezier(.3,1.7,.5,1);
  --c:#FF3B4E;
  --bc:#FF3B4E;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;overscroll-behavior:none;
  background-color:var(--room);
  background-image:radial-gradient(var(--room-dot) 2.5px,transparent 3px),radial-gradient(var(--room-dot) 2.5px,transparent 3px);
  background-size:44px 44px;background-position:0 0,22px 22px;
  color:var(--ink);font-family:var(--font-body);font-weight:700;
  padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,label:focus-within{outline:4px solid var(--sky);outline-offset:3px}

.app{
  height:100%;display:grid;gap:12px 14px;
  grid-template-columns:auto minmax(0,1fr) auto;
  grid-template-rows:auto minmax(0,1fr);
  grid-template-areas:"head head head" "tools stage paints";
}

/* ---------- header ---------- */
.head{grid-area:head;display:flex;align-items:center;gap:12px;min-width:0}
.brand{position:relative;display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.buddy{flex:none;width:66px;height:66px;padding:0;border:0;background:none;position:relative;z-index:21}
.buddy svg{width:100%;height:100%;overflow:visible;display:block;transform-origin:50% 90%}
.buddy .bd-body{fill:var(--bc);transition:fill .35s}
.buddy .bd-mouth{opacity:0}
.buddy.talk .bd-smile{opacity:0}
.buddy.talk .bd-mouth{opacity:1;animation:mouth .16s ease-in-out infinite alternate;transform-origin:50px 77px}
.buddy .bd-eyes{animation:blink 4.2s infinite;transform-origin:50px 60px}
.buddy.hop svg{animation:hop .7s var(--spring)}
.buddy.talk svg{animation:bob .5s ease-in-out infinite alternate}
.wordmark{
  font-family:var(--font-display);font-weight:700;font-size:28px;line-height:1;white-space:nowrap;
  color:#fff;background:var(--coral);border:var(--edge);border-radius:18px;padding:7px 16px 8px;
  box-shadow:var(--lift);transform:rotate(-1.5deg);text-shadow:0 2px 0 rgba(42,35,88,.35);
}
.wordmark{transition:opacity .2s}
.brand:has(.bubble.show) .wordmark{opacity:0}
.bubble{
  position:absolute;left:74px;top:50%;z-index:20;max-width:min(360px,62vw);
  background:#fff;border:var(--edge);border-radius:20px;box-shadow:var(--lift);
  padding:9px 16px 10px;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:1.15;
  transform:translateY(-50%) scale(.4);transform-origin:0 50%;opacity:0;pointer-events:none;
  transition:transform .35s var(--spring),opacity .2s;
}
.bubble::before{content:"";position:absolute;left:-13px;top:50%;width:18px;height:18px;margin-top:-9px;background:#fff;border-left:var(--edge);border-bottom:var(--edge);transform:rotate(45deg);border-radius:0 0 0 5px}
.bubble.show{transform:translateY(-50%) scale(1);opacity:1}
.bubble i{display:inline-block;width:.8em;height:.8em;border-radius:50%;border:2.5px solid var(--ink);vertical-align:-.05em;margin-right:.35em}

.actions{display:flex;gap:8px;align-items:center;flex:none}
.btn{
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:62px;height:60px;padding:0;background:var(--paper);border:var(--edge);border-radius:18px;box-shadow:var(--lift);
  font-family:var(--font-display);font-weight:600;font-size:11.5px;line-height:1;
  transition:transform .12s,box-shadow .12s,background .12s;
}
.btn svg{width:28px;height:28px;flex:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn[disabled]{opacity:.45;cursor:default}
.btn.pics{width:78px;background:var(--coral);color:#fff}
.btn.magic{background:var(--grape);color:#fff}
.btn.save{background:var(--mint);color:#fff}
.btn.pics span,.btn.magic span,.btn.save span{text-shadow:0 1px 0 rgba(42,35,88,.5)}
.btn.mini{width:52px}
.btn.mini b{font-family:var(--font-display);font-size:17px;line-height:28px;height:28px}
.btn[aria-pressed="false"] .snd-on{display:none}
.btn[aria-pressed="true"] .snd-off{display:none}

/* ---------- panels ---------- */
.panel{background:var(--paper);border:var(--edge);border-radius:26px;box-shadow:0 6px 0 var(--ink);padding:10px}
.tools{grid-area:tools;align-self:start;max-height:100%;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tray{display:grid;grid-template-columns:repeat(3,58px);gap:4px 6px}
.tool{
  position:relative;height:74px;padding:0 0 3px;border:0;background:transparent;border-radius:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
}
.tool::before{content:"";position:absolute;left:3px;right:3px;top:2px;height:54px;border-radius:50%;background:var(--sun);transform:scale(0);transition:transform .3s var(--spring)}
.tool[aria-pressed="true"]::before{transform:scale(1)}
.tool svg{position:relative;width:34px;height:52px;overflow:visible;transition:transform .3s var(--spring);filter:drop-shadow(0 2px 0 rgba(42,35,88,.22))}
.tool:hover svg{transform:translateY(-2px) rotate(-4deg)}
.tool[aria-pressed="true"] svg{transform:translateY(-4px) scale(1.14);animation:wiggle 1.8s ease-in-out .35s infinite}
.tool span{position:relative;font-family:var(--font-display);font-weight:600;font-size:10.5px;line-height:1;margin-top:3px;white-space:nowrap}
.k{stroke:var(--ink);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.k2{stroke:var(--ink);stroke-width:2}
.t{fill:var(--c)}
.sizes{display:flex;justify-content:space-between;gap:4px;margin-top:8px;padding-top:9px;border-top:3px dashed #E2DCF6}
.size{width:40px;height:40px;border-radius:50%;border:0;background:var(--cloud);display:grid;place-items:center;padding:0;transition:transform .2s var(--spring)}
.size i{display:block;border-radius:50%;background:var(--c);box-shadow:0 0 0 2.5px var(--ink)}
.size[aria-pressed="true"]{background:var(--sun);box-shadow:0 0 0 3px var(--ink);transform:scale(1.08)}

.paints{grid-area:paints;align-self:start;max-height:100%;overflow-y:auto;scrollbar-width:none}
.paints::-webkit-scrollbar{display:none}
.palette{display:grid;grid-template-columns:repeat(2,46px);gap:10px}
.blob{
  position:relative;width:46px;height:46px;padding:0;border-radius:50%;border:var(--edge);
  background:var(--b);box-shadow:0 3px 0 var(--ink);transition:transform .22s var(--spring);
}
.blob::after{content:"";position:absolute;left:17%;top:13%;width:36%;height:24%;border-radius:50%;background:#fff;opacity:.6;transform:rotate(-32deg);pointer-events:none}
.blob:hover{transform:translateY(-2px)}
.blob[aria-pressed="true"]{transform:scale(1.2);outline:4px solid var(--sun);outline-offset:2px;z-index:1}
.blob.mix{background:conic-gradient(#FF3B4E,#FFD60A,#1FBF5B,#35B6FF,#8B4DFF,#FF6FB5,#FF3B4E);overflow:hidden;cursor:pointer;display:block}
.blob.mix input{position:absolute;inset:-10px;width:70px;height:70px;opacity:0;cursor:pointer;border:0;padding:0}

/* ---------- the paper ---------- */
.stage{grid-area:stage;min-width:0;min-height:0;container-type:size;display:grid;place-items:center;position:relative}
.paperwrap{position:relative;width:min(100cqw,calc(100cqh * 1.6));aspect-ratio:8/5;max-width:100%}
.paper{position:absolute;inset:0;border:var(--edge);border-radius:20px;box-shadow:0 8px 0 var(--ink);background:#fff;overflow:hidden;touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#cv-paint{touch-action:none;cursor:crosshair}
#cv-lines{pointer-events:none}
.tape{position:absolute;width:92px;height:28px;background:rgba(255,226,122,.78);border:2px solid rgba(42,35,88,.18);pointer-events:none;z-index:2}
.tape.a{left:-26px;top:10px;transform:rotate(-38deg)}
.tape.b{right:-26px;top:10px;transform:rotate(38deg)}
.hint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;transition:opacity .5s,transform .5s}
.hint.gone{opacity:0;transform:scale(1.15)}
.hint div{text-align:center;font-family:var(--font-display);font-weight:700;font-size:clamp(26px,5.6cqw,62px);line-height:1.05;color:var(--ink);opacity:.85}
.hint svg{display:block;margin:0 auto 8px;width:clamp(80px,15cqw,170px);animation:bob 1.4s ease-in-out infinite alternate}
.hint small{display:block;font-size:.4em;font-weight:600;opacity:.7;margin-top:8px}
.fx{position:absolute;inset:0;pointer-events:none;z-index:3}
.spark{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;animation:burst 1.15s cubic-bezier(.2,.7,.3,1) forwards}
.spark.star{clip-path:polygon(50% 0,62% 36%,100% 38%,70% 60%,80% 100%,50% 76%,20% 100%,30% 60%,0 38%,38% 36%)}
.spark.dot{border-radius:50%;width:16px;height:16px;margin:-8px 0 0 -8px}
.spark.gem{transform:rotate(45deg);width:15px;height:15px;border-radius:3px}
.ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid var(--c);animation:ring .55s ease-out forwards}
.stickers{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);z-index:4;display:flex;gap:6px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;
  background:#fff;border:var(--edge);border-radius:22px;box-shadow:var(--lift);padding:6px 8px;animation:pop .3s var(--spring)}
.stickers::-webkit-scrollbar{display:none}
.sticker{flex:none;width:46px;height:46px;font-size:28px;line-height:1;border:0;border-radius:14px;background:var(--cloud);padding:0;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;transition:transform .2s var(--spring)}
.sticker[aria-pressed="true"]{background:var(--sun);transform:scale(1.12);box-shadow:0 0 0 3px var(--ink)}
.turn{display:none}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:rgba(42,35,88,.55);
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet-card{width:min(1000px,100%);max-height:100%;overflow:auto;background:var(--paper);border:var(--edge);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:0 18px 20px;animation:rise .38s var(--spring)}
.sheet-top{position:sticky;top:0;z-index:2;background:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 12px}
.sheet h2{margin:0;font-family:var(--font-display);font-weight:700;font-size:30px;line-height:1.1;text-wrap:balance}
.sheet h3{margin:6px 0 10px;font-family:var(--font-display);font-weight:600;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.xbtn{flex:none;width:52px;height:52px;border-radius:50%;border:var(--edge);background:var(--cloud);box-shadow:var(--lift);display:grid;place-items:center;padding:0}
.xbtn svg{width:24px;height:24px}
.xbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.pic{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 8px 7px;border:var(--edge);border-radius:20px;background:#fff;box-shadow:var(--lift);
  font-family:var(--font-display);font-weight:600;font-size:17px;line-height:1.1;transition:transform .2s var(--spring)}
.pic canvas{width:100%;aspect-ratio:8/5;display:block;border-radius:12px;background:#fff}
.pic:hover{transform:translateY(-3px) rotate(-1deg)}
.pic:active{transform:translateY(2px)}
.pic[aria-pressed="true"]{background:var(--sun)}
.magic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-bottom:18px}
.mtile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px 9px;border:var(--edge);border-radius:20px;background:#fff;box-shadow:var(--lift);
  font-family:var(--font-display);font-weight:600;font-size:16px;line-height:1.1;transition:transform .2s var(--spring)}
.mtile svg{width:100%;height:46px}
.mtile .sw{width:100%;height:58px;border:var(--edge);border-radius:14px}
.mtile[aria-pressed="true"]{background:var(--sun);transform:translateY(-2px)}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(203,220,255,.82);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.splash-card{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.splash .big-buddy{width:clamp(110px,22vmin,170px);height:clamp(110px,22vmin,170px);animation:bob 1.6s ease-in-out infinite alternate}
.splash .big-buddy .bd-body{fill:var(--coral)}
.splash .wordmark{font-size:clamp(36px,8vmin,64px);border-radius:26px;padding:10px 26px 14px}
.play{display:inline-flex;align-items:center;gap:12px;min-width:min(330px,80vw);height:clamp(74px,14vmin,96px);justify-content:center;padding:0 28px;
  background:var(--mint);color:#fff;border:var(--edge);border-radius:999px;box-shadow:0 7px 0 var(--ink);
  font-family:var(--font-display);font-weight:700;font-size:clamp(28px,6vmin,38px);text-shadow:0 2px 0 rgba(42,35,88,.4);animation:pulse 1.6s ease-in-out infinite}
.play svg{width:1.1em;height:1.1em}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.langs{display:flex;gap:10px}
.langs button{height:44px;padding:0 18px;border:var(--edge);border-radius:999px;background:#fff;box-shadow:var(--lift);font-family:var(--font-display);font-weight:600;font-size:17px}
.langs button[aria-pressed="true"]{background:var(--sun)}

.viewer{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(42,35,88,.72);padding:20px}
.viewer>div{background:#fff;border:var(--edge);border-radius:24px;padding:16px;max-width:min(92vw,820px);text-align:center;font-family:var(--font-display);font-weight:600}
.viewer img{display:block;max-width:100%;max-height:66vh;border:var(--edge);border-radius:14px;margin:0 auto 12px;-webkit-user-select:auto;user-select:auto}
.viewer .btn{flex-direction:row;width:auto;padding:0 24px;font-size:16px;margin:0 auto}

/* ---------- motion ---------- */
@keyframes wiggle{0%,100%{rotate:0deg}25%{rotate:-7deg}75%{rotate:7deg}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@keyframes hop{0%{transform:scale(1)}30%{transform:translateY(-14px) scale(1.12,.92)}60%{transform:translateY(0) scale(.94,1.06)}100%{transform:scale(1)}}
@keyframes mouth{from{transform:scaleY(.45)}to{transform:scaleY(1.15)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@keyframes burst{0%{transform:translate(0,0) scale(.3) rotate(0);opacity:1}70%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(4);opacity:0}}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes rise{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* ---------- short landscape (phones on their side) ---------- */
@media (orientation:landscape) and (max-height:620px){
  body{padding-block:6px}
  .app{gap:8px 10px}
  .buddy{width:48px;height:48px}
  .wordmark{display:none}
  .bubble{left:56px;font-size:17px;padding:6px 12px 7px}
  .btn{width:46px;height:44px;border-radius:14px}
  .btn span{display:none}
  .btn.pics{width:56px}
  .btn.mini{width:44px}
  .btn svg{width:26px;height:26px}
  .panel{padding:7px;border-radius:20px;box-shadow:0 4px 0 var(--ink)}
  .tray{grid-template-columns:repeat(3,46px);gap:2px 4px}
  .tool{height:54px;padding-bottom:0}
  .tool span{display:none}
  .tool::before{top:3px;height:46px}
  .tool svg{width:28px;height:44px}
  .size{width:32px;height:32px}
  .palette{grid-template-columns:repeat(2,36px);gap:8px}
  .blob{width:36px;height:36px}
}

/* ---------- portrait (phones and tablets held upright) ---------- */
@media (orientation:portrait){
  html,body{height:auto;min-height:100%}
  body{overflow-x:hidden;overflow-y:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:none;grid-template-areas:"head" "stage" "paints" "tools"}
  .head{flex-wrap:wrap;row-gap:10px}
  .actions{width:100%;justify-content:space-between}
  .stage{container-type:normal}
  .paperwrap{width:100%}
  .tools,.paints{align-self:stretch;max-height:none;overflow:visible}
  .tray{grid-template-columns:repeat(6,minmax(0,1fr))}
  .palette{grid-template-columns:repeat(8,minmax(0,1fr));justify-items:center}
  .turn{display:block;margin:10px 0 0;text-align:center;font-family:var(--font-display);font-weight:600;font-size:14px;opacity:.7}
}
@media (orientation:portrait) and (max-width:520px){
  .wordmark{font-size:22px;padding:6px 12px 7px}
  .buddy{width:52px;height:52px}
  .bubble{left:60px;font-size:18px}
  .btn{width:46px;height:48px;border-radius:15px}
  .btn span{display:none}
  .btn.pics{width:58px}
  .btn.mini{width:44px}
  .palette{gap:8px 4px}
  .blob{width:36px;height:36px}
  .tool{height:66px}
}
@media (orientation:portrait) and (min-width:700px){
  .tray{grid-template-columns:repeat(9,minmax(0,1fr))}
  .palette{grid-template-columns:repeat(16,minmax(0,1fr))}
  .blob{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="g-rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF3B4E"/><stop offset=".25" stop-color="#FFD60A"/><stop offset=".5" stop-color="#1FBF5B"/><stop offset=".75" stop-color="#35B6FF"/><stop offset="1" stop-color="#8B4DFF"/>
    </linearGradient>
  </defs>
</svg>

<div class="app" id="app">
  <header class="head">
    <div class="brand">
      <button class="buddy" id="buddy" type="button" aria-label="Drip, your paint buddy">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path class="bd-body" d="M50 5C62 22 87 40 87 63C87 83 70 96 50 96C30 96 13 83 13 63C13 40 38 22 50 5Z" stroke="#2A2358" stroke-width="4.5" stroke-linejoin="round"/>

function bucket(x0,y0){
  var x=Math.max(0,Math.min(W-1,Math.round(x0))),y=Math.max(0,Math.min(H-1,Math.round(y0)));
  var t=document.createElement('canvas');t.width=W;t.height=H;var tc=t.getContext('2d',{willReadFrequently:true});

  function near(i){
    if(a0<40)return d[i+3]<40;
    return Math.abs(d[i]-r0)<=48&&Math.abs(d[i+1]-g0)<=48&&Math.abs(d[i+2]-b0)<=48&&Math.abs(d[i+3]-a0)<=48;
  }
  var mask=new Uint8Array(W*H),st=[x,y];
  while(st.length){
    var cy=st.pop(),cx=st.pop();
    if(mask[cy*W+cx]||!near((cy*W+cx)*4))continue;
    var l=cx,r=cx;
    while(l>0&&!mask[cy*W+l-1]&&near((cy*W+l-1)*4))l--;
    while(r<W-1&&!mask[cy*W+r+1]&&near((cy*W+r+1)*4))r++;
    for(var k=l;k<=r;k++)mask[cy*W+k]=1;
    for(var dy=-1;dy<=1;dy+=2){
      var ny=cy+dy;if(ny<0||ny>=H)continue;var run=false;
      for(var q=l;q<=r;q++){var j=ny*W+q,ok=!mask[j]&&near(j*4);if(ok&&!run){st.push(q,ny);run=true}else if(!ok)run=false}
    }

  for(var it=0;it<2;it++){
    var m2=mask.slice();
    for(var yy=1;yy<H-1;yy++)for(var xx=1;xx<W-1;xx++){
      var i=yy*W+xx;
      if(!mask[i]&&d[i*4+3]<250&&(mask[i-1]||mask[i+1]||mask[i-W]||mask[i+W]))m2[i]=1;

var symBox=$('#syms');
SYMS.forEach(function(s,i){
  var b=el('button','mtile','<svg viewBox="0 0 100 42" aria-hidden="true">'+SYMICON[i]+'</svg>');
  b.type='button';b.dataset.sym=i;b.setAttribute('aria-pressed','false');b.appendChild(label([0,s[0],s[1]]));
  b.addEventListener('click',function(){S.sym=i;syncUI();voice('misc',6+i);pop();closeSheets()});
  symBox.appendChild(b);
});
var bgBox=$('#bgs');
BGS.forEach(function(g,i){
  var b=el('button','mtile','<span class="sw" style="background:'+BGCSS[g[0]]+'"></span>');
  b.type='button';b.dataset.bg=g[0];b.setAttribute('aria-pressed','false');b.appendChild(label(g));
  b.addEventListener('click',function(){var before=snap();S.bg=g[0];renderBg(S.bg);commit(before);hideHint();syncUI();voice('misc',i);pop();closeSheets()});
  bgBox.appendChild(b);
});

var picsBox=$('#pics'),picsBuilt=false;
function buildPics(){
  if(picsBuilt)return;picsBuilt=true;
  PAGES.forEach(function(p,i){
    var b=el('button','pic');b.type='button';b.dataset.page=p[0];b.setAttribute('aria-pressed','false');
    var cv=document.createElement('canvas');cv.width=320;cv.height=200;
    var cc=cv.getContext('2d');
    if(p[0]==='none'){cc.fillStyle='#fff';cc.fillRect(0,0,320,200);cc.setLineDash([10,9]);cc.lineWidth=5;cc.strokeStyle='#B9B2DA';cc.strokeRect(40,30,240,140);cc.setLineDash([]);
      cc.font='600 54px Fredoka, sans-serif';cc.textAlign='center';cc.textBaseline='middle';cc.fillStyle='#2A2358';cc.fillText('✎',160,102)}
    else drawPage(cc,p[0],26,0.2);
    b.appendChild(cv);b.appendChild(label(p));
    b.addEventListener('click',function(){
      var before=snap();px.clearRect(0,0,W,H);S.page=p[0];S.bg='white';renderBg('white');renderPage(S.page);commit(before);
      if(p[0]!=='none')hideHint();syncUI();closeSheets();voice('pages',i);pop();
    });
    picsBox.appendChild(b);
  });
  applyLang();syncUI();
}

/* ---------- show the state ---------- */
function press1(sel,test){document.querySelectorAll(sel).forEach(function(n){n.setAttribute('aria-pressed',test(n)?'true':'false')})}
function syncUI(){
  press1('[data-tool]',function(n){return n.dataset.tool===S.tool});
  press1('[data-color]',function(n){return n.dataset.color===S.color});
  press1('[data-size]',function(n){return +n.dataset.size===S.size});
  press1('[data-sym]',function(n){return +n.dataset.sym===S.sym});
  press1('[data-bg]',function(n){return n.dataset.bg===S.bg});
  press1('[data-page]',function(n){return n.dataset.page===S.page});
  press1('[data-stamp]',function(n){return n.dataset.stamp===S.stamp});
  press1('[data-lang]',function(n){return n.dataset.lang===LANG});
  var root=document.documentElement.style;root.setProperty('--c',S.color);
  root.setProperty('--bc',S.color==='#1B1B2F'?'#5B5490':S.color);
  var em=document.querySelector('.stamp-emoji');if(em)em.textContent=S.stamp;
  var mix=$('#color-pick');if(mix&&/^#[0-9A-F]{6}$/i.test(S.color))mix.value=S.color.toLowerCase();
  $('#b-snd').setAttribute('aria-pressed',S.sound?'true':'false');
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-t]').forEach(function(n){n.textContent=T(n.dataset.t)});
  document.querySelectorAll('[data-t-label]').forEach(function(n){n.setAttribute('aria-label',T(n.dataset.tLabel))});
  document.querySelectorAll('[data-es]').forEach(function(n){
    var v=LANG==='es'?n.dataset.es:n.dataset.en;
    if(n.tagName==='SPAN')n.textContent=v;else{n.setAttribute('aria-label',v);n.title=v}
  });
  $('#hint-txt').textContent=T('hint');$('#hint-sub').textContent=T('hintSub');
  $('#lang-txt').textContent=LANG.toUpperCase();
}

/* ---------- sheets, viewer ---------- */
function anySheet(){return !$('#sheet-pics').hidden||!$('#sheet-magic').hidden||!$('#splash').hidden}
function closeSheets(){$('#sheet-pics').hidden=true;$('#sheet-magic').hidden=true}
document.querySelectorAll('.sheet').forEach(function(s){
  s.addEventListener('click',function(e){if(e.target===s||e.target.closest('[data-close]')){closeSheets();pop()}});
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){closeSheets();$('#viewer').hidden=true}
  var k=e.key.toLowerCase();
  if((e.metaKey||e.ctrlKey)&&k==='z'){e.preventDefault();doUndo()}
});
function showViewer(canvas){$('#viewer-img').src=canvas.toDataURL('image/png');$('#viewer-msg').textContent=T('saveHelp');$('#viewer').hidden=false}
$('#viewer-x').addEventListener('click',function(){$('#viewer').hidden=true});
$('#viewer').addEventListener('click',function(e){if(e.target===this)this.hidden=true});

/* ---------- header buttons ---------- */
$('#b-pics').addEventListener('click',function(){ac();buildPics();$('#sheet-pics').hidden=false;pop()});
$('#b-magic').addEventListener('click',function(){ac();$('#sheet-magic').hidden=false;pop()});
$('#b-undo').addEventListener('click',doUndo);
$('#b-clear').addEventListener('click',function(){
  ac();var before=snap();px.clearRect(0,0,W,H);commit(before);whoosh();voice('misc',14);
});
$('#b-save').addEventListener('click',function(){
  ac();voice('misc',16);celebrate();
  exportPNG(function(blob,canvas){
    var name=LANG==='es'?'mi-dibujo.png':'my-painting.png';
    function fallback(){showViewer(canvas)}
    /* Desktop app: native "Save As" dialog through the preload bridge. */
    if(window.magicPaint&&window.magicPaint.savePNG){
      blob.arrayBuffer().then(function(buf){return window.magicPaint.savePNG(name,buf)})
        .then(function(r){if(r&&r.error)fallback()}).catch(fallback);
      return;
    }
    /* Browser: regular download. */
    try{
      var url=URL.createObjectURL(blob),a=document.createElement('a');
      a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},4000);
    }catch(e){fallback()}
  });
});
$('#b-snd').addEventListener('click',function(){
  S.sound=!S.sound;try{localStorage.setItem('pm-sound',S.sound?'1':'0')}catch(e){}
  if(!S.sound)stopVoice();else{ac();pop()}
  syncUI();
});
function setLang(l){
  LANG=l;try{localStorage.setItem('pm-lang',LANG)}catch(e){}
  applyLang();syncUI();loadVoices(LANG);
}
$('#b-lang').addEventListener('click',function(){setLang(LANG==='es'?'en':'es');pop()});
document.querySelectorAll('[data-lang]').forEach(function(b){b.addEventListener('click',function(){setLang(b.dataset.lang);pop()})});
$('#b-play').addEventListener('click',function(){
  ac();loadVoices(LANG);$('#splash').hidden=true;hop();voice('hello',0);armIdle();
});

/* ---------- start ---------- */
renderBg('white');renderPage('none');applyLang();syncUI();btns();loadSaved();loadVoices(LANG);
})();
</script>

</body></html>
